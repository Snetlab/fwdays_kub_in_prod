apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-audit-log
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module05-kyverno-audit-log
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module05-kyverno-audit-log
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module05-kyverno-audit-log
subjects:
  - kind: ServiceAccount
    name: kyverno-audit-log
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-audit-log
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kyverno-audit-log
  template:
    metadata:
      labels:
        app: kyverno-audit-log
    spec:
      serviceAccountName: kyverno-audit-log
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: audit
          image: python:3.12-alpine
          command: [python, -u, /app/audit.py]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: kyverno-audit-log-code
