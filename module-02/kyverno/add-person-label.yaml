apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: module02-person
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
  - name: set-mentor
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaces: [mentor]
          operations: [CREATE, UPDATE]
    mutate:
      patchStrategicMerge:
        metadata:
          labels:
            person: mentor
  - name: set-student
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaces: [student01, student02, student03]
          operations: [CREATE, UPDATE]
    mutate:
      patchStrategicMerge:
        metadata:
          labels:
            person: student
  - name: remove-person
    match:
      any:
      - resources:
          kinds: [Pod]
          operations: [CREATE, UPDATE]
    exclude:
      any:
      - resources:
          namespaces: [mentor, student01, student02, student03]
    preconditions:
      all:
      - key: person
        operator: AnyIn
        value: "{{ keys(request.object.metadata.labels || `{}`) }}"
    mutate:
      patchesJson6902: |-
        - op: remove
          path: /metadata/labels/person
