apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module02-workload-write
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module02-write
  namespace: student01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module02-workload-write
subjects:
- kind: ServiceAccount
  name: mentor
  namespace: module02-identities
- kind: ServiceAccount
  name: student01
  namespace: module02-identities
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module02-read
  namespace: student01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: student02
  namespace: module02-identities
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module02-write
  namespace: student02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module02-workload-write
subjects:
- kind: ServiceAccount
  name: mentor
  namespace: module02-identities
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module02-write
  namespace: student03
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module02-workload-write
subjects:
- kind: ServiceAccount
  name: mentor
  namespace: module02-identities
- kind: ServiceAccount
  name: student03
  namespace: module02-identities
